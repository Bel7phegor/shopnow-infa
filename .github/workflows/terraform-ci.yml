name: Terraform CI/CD

# Workflow Architecture (Tag-based Release):
# 1. PR to 'develop' hoặc 'main' -> Chạy Validate & Plan (Không Apply).
# 2. Push/Merge to 'develop'     -> Tự động Plan & Apply cho DEV.
# 3. Tạo Tag (ví dụ: v1.0.0)     -> Chạy Plan & Apply cho PROD (Cần Approve).

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "**.tf"
      - "**.tfvars"
      - ".github/workflows/terraform-ci.yml"

  push:
    branches:
      - develop
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: ap-southeast-3
  TF_VERSION: "1.8.0"

jobs:

  validate:
    name: "Validate [${{ github.ref_name }}]"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check Terraform format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init (Local validation mode)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Evaluate execution guardrails
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "Error: Terraform code is not formatted. Please run 'terraform fmt -recursive' locally and re-commit."
          exit 1

  # JOB 2: PLAN
  plan:
    name: "Plan [Target: ${{ github.base_ref || github.ref_name }}]"
    runs-on: ubuntu-latest
    needs: validate

    outputs:
      tf_env: ${{ steps.set_env.outputs.tf_env }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment variables
        id: set_env
        run: |
          echo "Log: Event=${{ github.event_name }}, RefType=${{ github.ref_type }}, BaseRef=${{ github.base_ref }}"
          
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "tf_env=prod"                                       >> $GITHUB_OUTPUT
            echo "tf_varfile=environments/prod/terraform.tfvars"     >> $GITHUB_OUTPUT
            echo "state_key=prod/terraform.tfstate"                  >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.TERRAFORM_ROLE_ARN_PROD }}"   >> $GITHUB_OUTPUT
          else
            echo "tf_env=dev"                                        >> $GITHUB_OUTPUT
            echo "tf_varfile=environments/dev/terraform.tfvars"      >> $GITHUB_OUTPUT
            echo "state_key=dev/terraform.tfstate"                   >> $GITHUB_OUTPUT
            echo "role_arn=${{ secrets.TERRAFORM_ROLE_ARN_DEV }}"    >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.set_env.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ steps.set_env.outputs.state_key }}" \
            -backend-config="bucket=shopnow-terraform-state" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=shopnow-terraform-lock" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -no-color

      - name: Terraform Plan
        id: plan
        shell: bash
        run: |
          set -o pipefail
          terraform plan \
            -var-file=${{ steps.set_env.outputs.tf_varfile }} \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ steps.set_env.outputs.tf_env }}
          path: tfplan
          retention-days: 1

      - name: Post plan summary to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen ? plan.slice(0, maxLen) + '\n\n...(Output truncated)' : plan;
            
            const body = [
              `### Terraform Plan Summary — Môi trường: \`${{ steps.set_env.outputs.tf_env }}\``,
              `**Luồng nhánh:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\``,
              '<details><summary>Chi tiết log tóm tắt</summary>\n\n```\n' + truncated + '\n```\n</details>'
            ].join('\n');
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Terraform Plan Summary'));
            if (botComment) {
              await github.rest.issues.deleteComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: botComment.id });
            }
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

  # JOB 3a: APPLY DEV
  apply-dev:
    name: "Apply [dev]"
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref_name == 'develop'
    
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="bucket=shopnow-terraform-state" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=shopnow-terraform-lock" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -no-color

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan

  # JOB 3b: APPLY PROD
  apply-prod:
    name: "Apply [prod]"
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref_type == 'tag'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TERRAFORM_ROLE_ARN_PROD }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="bucket=shopnow-terraform-state" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=shopnow-terraform-lock" \
            -backend-config="encrypt=true" \
            -reconfigure \
            -no-color

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod

      - name: Terraform Apply
        run: terraform apply -auto-approve -no-color tfplan